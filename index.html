<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CIP - Gestão Comunitária">
  <title>CIP | Gestão Comunitária</title>

  <style>
    :root{
      --bg:#f5f7fb;
      --surface:#fff;
      --text:#172033;
      --muted:#697386;
      --primary:#5b46e8;
      --border:#e6e9f0;
      --success:#16875a;
      --danger:#c63d4f;
      --shadow:0 10px 30px rgba(25,31,50,.07);
      --radius:16px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,input,select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .sidebar{
      position:fixed;
      left:0;
      top:0;
      bottom:0;
      width:245px;
      background:#17182b;
      color:white;
      padding:22px 15px;
      display:flex;
      flex-direction:column;
    }

    .brand{
      display:flex;
      gap:11px;
      align-items:center;
      padding:6px 10px 28px;
    }

    .brand-mark{
      width:44px;
      height:44px;
      border-radius:13px;
      background:linear-gradient(135deg,#8b7cff,#5b46e8);
      display:grid;
      place-items:center;
      font-weight:800;
    }

    .brand strong,
    .brand span{
      display:block;
    }

    .brand strong{
      font-size:12px;
    }

    .brand span{
      font-size:11px;
      color:#b8b9c9;
      margin-top:3px;
    }

    nav{
      display:grid;
      gap:5px;
    }

    .nav-item{
      border:0;
      background:transparent;
      color:#c7c8d5;
      text-align:left;
      padding:12px 13px;
      border-radius:11px;
      display:flex;
      gap:11px;
      align-items:center;
    }

    .nav-item:hover,
    .nav-item.active{
      background:#2a2b45;
      color:white;
    }

    .sidebar-foot{
      margin-top:auto;
      color:#85879c;
      font-size:11px;
      line-height:1.5;
      padding:10px;
    }

    .main{
      margin-left:245px;
      min-height:100vh;
    }

    .topbar{
      height:88px;
      background:white;
      border-bottom:1px solid var(--border);
      padding:17px 32px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:5;
    }

    .eyebrow{
      font-size:10px;
      font-weight:800;
      letter-spacing:.14em;
      color:var(--primary);
    }

    h1{
      margin:2px 0 0;
      font-size:25px;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:18px;
      color:var(--muted);
      font-size:13px;
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:10px 15px;
      font-weight:700;
    }

    .btn-primary{
      background:var(--primary);
      color:white;
    }

    .btn-primary:hover{
      background:#4c39d6;
    }

    .btn-light{
      background:#f0f2f7;
      color:var(--text);
    }

    .btn-danger{
      background:#fff0f1;
      color:var(--danger);
    }

    .content{
      padding:28px 32px;
    }

    .grid{
      display:grid;
      gap:18px;
    }

    .stats{
      grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .card{
      background:white;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
    }

    .stat .label{
      font-size:12px;
      color:var(--muted);
    }

    .stat .value{
      font-size:30px;
      font-weight:800;
      margin:7px 0;
    }

    .stat .hint{
      font-size:11px;
      color:var(--muted);
    }

    .two{
      grid-template-columns:1.25fr .75fr;
      margin-top:18px;
    }

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
    }

    .section-title h2{
      font-size:16px;
      margin:0;
    }

    .muted{
      color:var(--muted);
    }

    .table-wrap{
      overflow:auto;
    }

    .table{
      width:100%;
      border-collapse:collapse;
    }

    .table th,
    .table td{
      padding:13px 10px;
      border-bottom:1px solid var(--border);
      font-size:13px;
      text-align:left;
      white-space:nowrap;
    }

    .table th{
      color:var(--muted);
      font-size:11px;
      text-transform:uppercase;
    }

    .badge{
      display:inline-flex;
      padding:5px 8px;
      border-radius:99px;
      font-size:10px;
      font-weight:800;
      background:#eef0ff;
      color:#5544c8;
    }

    .badge.green{
      background:#eaf8f1;
      color:#16875a;
    }

    .badge.red{
      background:#fff0f1;
      color:#c63d4f;
    }

    .actions{
      display:flex;
      gap:6px;
    }

    .icon-btn{
      border:0;
      background:#f1f3f7;
      border-radius:8px;
      padding:7px;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .input,
    .select{
      border:1px solid #dfe3ec;
      background:white;
      border-radius:10px;
      padding:10px 11px;
      outline:none;
      width:100%;
    }

    .input:focus,
    .select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(91,70,232,.1);
    }

    .search{
      max-width:350px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
    }

    .field{
      display:grid;
      gap:6px;
    }

    .field label{
      font-size:12px;
      font-weight:700;
    }

    .full{
      grid-column:1/-1;
    }

    .form-actions{
      display:flex;
      justify-content:flex-end;
      gap:9px;
      margin-top:20px;
    }

    .empty{
      text-align:center;
      padding:35px;
      color:var(--muted);
    }

    .course-grid{
      grid-template-columns:repeat(3,1fr);
    }

    .course-card{
      min-height:155px;
    }

    .course-icon{
      font-size:28px;
    }

    .course-card h3{
      margin:9px 0 5px;
    }

    .course-meta{
      font-size:12px;
      color:var(--muted);
    }

    .attendance-head{
      display:grid;
      grid-template-columns:1fr 180px;
      gap:10px;
      margin-bottom:16px;
    }

    .person-row{
      display:grid;
      grid-template-columns:1fr 130px 120px;
      gap:10px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid var(--border);
    }

    .check{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
    }

    .check input{
      width:18px;
      height:18px;
    }

    .notice{
      padding:13px 15px;
      background:#f3f1ff;
      border:1px solid #dfd9ff;
      border-radius:12px;
      color:#493aa4;
      font-size:12px;
      line-height:1.5;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(10,12,25,.5);
      display:grid;
      place-items:center;
      padding:20px;
      z-index:20;
    }

    .modal.hidden,
    .toast.hidden{
      display:none;
    }

    .modal-card{
      width:min(720px,100%);
      max-height:90vh;
      overflow:auto;
      background:white;
      border-radius:18px;
      padding:25px;
      position:relative;
    }

    .modal-close{
      position:absolute;
      right:15px;
      top:12px;
      border:0;
      background:#f0f2f7;
      width:32px;
      height:32px;
      border-radius:50%;
      font-size:22px;
    }

    .modal-card h2{
      margin-top:0;
    }

    .toast{
      position:fixed;
      right:25px;
      bottom:25px;
      background:#17182b;
      color:white;
      padding:12px 17px;
      border-radius:10px;
      z-index:30;
      font-size:13px;
    }

    .report-kpis{
      grid-template-columns:repeat(3,1fr);
    }

    .chart{
      display:grid;
      gap:12px;
    }

    .chart-line{
      display:grid;
      grid-template-columns:120px 1fr 45px;
      align-items:center;
      gap:9px;
      font-size:11px;
    }

    .bar{
      height:10px;
      background:#edf0f5;
      border-radius:99px;
      overflow:hidden;
    }

    .bar span{
      display:block;
      height:100%;
      background:linear-gradient(90deg,#5b46e8,#8b7cff);
      border-radius:99px;
    }

    .small{
      font-size:11px;
    }

    .footer-note{
      margin-top:20px;
      color:var(--muted);
      font-size:11px;
    }

    @media(max-width:950px){
      .sidebar{
        width:72px;
      }

      .brand strong,
      .brand span,
      .nav-item span,
      .sidebar-foot{
        display:none;
      }

      .brand{
        justify-content:center;
      }

      .main{
        margin-left:72px;
      }

      .stats,
      .course-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .two{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:650px){
      .topbar{
        padding:15px 17px;
      }

      .content{
        padding:18px;
      }

      .stats,
      .course-grid,
      .report-kpis,
      .form-grid{
        grid-template-columns:1fr;
      }

      .attendance-head{
        grid-template-columns:1fr;
      }

      .person-row{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-mark">CIP</div>

      <div>
        <strong>Centro de Identidade</strong>
        <span>Gestão Comunitária</span>
      </div>
    </div>

    <nav>

      <button class="nav-item active" data-view="dashboard">
        📊 <span>Painel</span>
      </button>

      <button class="nav-item" data-view="participants">
        👥 <span>Participantes</span>

      <button class="nav-item" data-view="courses">

      <button class="nav-item" data-view="attendance">

      <button class="nav-item" data-view="reports">

      </button>

      <button class="nav-item" data-view="settings">

      </button>

    </nav>

    <div class="sidebar-foot">
      MVP • Projeto Prático<br>
      Dados de demonstração
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div>
        <div class="eyebrow">PROJETO DE EXTENSÃO</div>
        <h1 id="page-title">Painel</h1>
      </div>

      <div class="top-actions">
        <span id="today-label"></span>

        <button class="btn btn-primary" id="quick-add">
          + Novo cadastro
        </button>
      </div>

    </header>

    <section id="content"></section>

  </main>

</div>


<div class="modal hidden" id="modal">

  <div class="modal-card">

    <button class="modal-close" id="modal-close">
      ×
    </button>

    <div id="modal-content"></div>

  </div>

</div>


<div class="toast hidden" id="toast"></div>

let db = load();

let currentView = "dashboard";


function load(){

  try{

    const saved =
      JSON.parse(localStorage.getItem(KEY));

    if(!saved){

      return structuredClone(seed);

    }

    return saved;

  }catch{

    return structuredClone(seed);

  }

}


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );

}


function $(selector){

  return document.querySelector(selector);

}


function esc(value=""){

  return String(value).replace(
    /[&<>'"]/g,

    function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"

      }[char];

    }

  );

}


function fmtDate(date){

  if(!date){

    return "-";

  }

  const [year,month,day] =
    date.split("-");

  return `${day}/${month}/${year}`;

}


function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function course(id){

  return db.courses.find(
    item => item.id === id
  );

}


function person(id){

  return db.participants.find(
    item => item.id === id
  );

}


function activeEnrollments(participantId){

  return db.enrollments.filter(
    item => item.participantId === participantId
  );

}


function showToast(message){

  const toast = $("#toast");

  toast.textContent = message;

  toast.classList.remove("hidden");

  setTimeout(
    () => toast.classList.add("hidden"),
    2300
  );

}


function openModal(html){

  $("#modal-content").innerHTML = html;

  $("#modal").classList.remove("hidden");

}


function closeModal(){

  $("#modal").classList.add("hidden");

}


function nextId(prefix,array){

  return prefix +
    String(array.length + 1)
      .padStart(3,"0");

}


/* =========================
   NAVEGAÇÃO
========================= */

function go(view){

  currentView = view;

  render();

}


/* =========================
   RENDER PRINCIPAL
========================= */

function render(){

  const titles = {

    dashboard:"Painel",
    participants:"Participantes",
    courses:"Cursos",
    attendance:"Presença",
    reports:"Relatórios",
    settings:"Dados e backup"

  };


  $("#page-title").textContent =
    titles[currentView];


  $("#today-label").textContent =
    new Date().toLocaleDateString(
      "pt-BR",
      {
        weekday:"short",
        day:"2-digit",
        month:"short"
      }
    );


  document
    .querySelectorAll(".nav-item")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.view === currentView
      );

    });


  const renderers = {

    dashboard:renderDashboard,
    participants:renderParticipants,
    courses:renderCourses,
    attendance:renderAttendance,
    reports:renderReports,
    settings:renderSettings

  };


  renderers[currentView]();

}


/* =========================
   PAINEL
========================= */

function renderDashboard(){

  const activeParticipants =
    db.participants.filter(
      p => p.active
    ).length;


  const activeCourses =
    db.courses.filter(
      c => c.active
    ).length;


  const enrollments =
    db.enrollments.length;


  const todayAttendance =
    db.attendance.filter(
      a =>
        a.date === today() &&
        a.present
    ).length;


  const latest =
    [...db.attendance]
      .sort(
        (a,b) =>
          b.date.localeCompare(a.date)
      )
      .slice(0,6);


  $("#content").innerHTML = `

    <div class="grid stats">

      <div class="card stat">
        <div class="label">
          Participantes ativos
        </div>

        <div class="value">
          ${activeParticipants}
        </div>

        <div class="hint">
          pessoas cadastradas
        </div>
      </div>


      <div class="card stat">
        <div class="label">
          Cursos ativos
        </div>

        <div class="value">
          ${activeCourses}
        </div>

        <div class="hint">
          atividades oferecidas
        </div>
      </div>


      <div class="card stat">
        <div class="label">
          Inscrições
        </div>

        <div class="value">
          ${enrollments}
        </div>

        <div class="hint">
          inscrições em cursos
        </div>
      </div>


      <div class="card stat">
        <div class="label">
          Presenças hoje
        </div>

        <div class="value">
          ${todayAttendance}
        </div>

        <div class="hint">
          registradas no sistema
        </div>
      </div>

    </div>


    <div class="grid two">

      <div class="card">

        <div class="section-title">

          <h2>
            Últimas presenças
          </h2>

          <button
            class="btn btn-light"
            onclick="go('attendance')"
          >
            Registrar presença
          </button>

        </div>


        ${
          latest.length

          ?

          `
          <div class="table-wrap">

            <table class="table">

              <thead>

                <tr>
                  <th>Data</th>
                  <th>Participante</th>
                  <th>Curso</th>
                  <th>Status</th>
                </tr>

              </thead>

              <tbody>

                ${latest.map(a => `

                  <tr>

                    <td>
                      ${fmtDate(a.date)}
                    </td>

                    <td>
                      ${esc(
                        person(a.participantId)?.name || "—"
                      )}
                    </td>

                    <td>
                      ${esc(
                        course(a.courseId)?.name || "—"
                      )}
                    </td>

                    <td>

                      <span class="badge ${
                        a.present
                          ? "green"
                          : "red"
                      }">

                        ${
                          a.present
                            ? "Presente"
                            : "Falta"
                        }

                      </span>

                    </td>

                  </tr>

                `).join("")}

              </tbody>

function toggleParticipant(id){

  const p = person(id);

  if(!p){
    return;
  }


  const message =
    p.active
      ? `Inativar "${p.name}"?`
      : `Reativar "${p.name}"?`;


  if(confirm(message)){

    p.active = !p.active;

    save();

    render();

    showToast(
      p.active
        ? "Participante reativado."
        : "Participante inativado."
    );

  }

}


/* =========================
   EXCLUIR
========================= */

function deleteParticipant(id){

  const p = person(id);

  if(!p){
    return;
  }


  const confirmed =
    confirm(
      `Excluir definitivamente "${p.name}"?\n\n` +
      `Isso também removerá as inscrições e ` +
      `presenças dessa pessoa.`
    );


  if(!confirmed){
    return;
  }


  db.participants =
    db.participants.filter(
      item => item.id !== id
    );


  db.enrollments =
    db.enrollments.filter(
      item => item.participantId !== id
    );


  db.attendance =
    db.attendance.filter(
      item => item.participantId !== id
    );


  save();

  render();

  showToast(
    "Participante excluído."
  );

}

function loadAttendanceList(){

  const courseId =

  const date =

  const enrolled =
    db.enrollments

      .filter(
        e => e.courseId === courseId
      )

      .map(
        e => person(e.participantId)
      )

      .filter(Boolean);


  const existing =
    new Map(

      db.attendance

        .filter(
          a =>
            a.courseId === courseId &&
            a.date === date

        .map(

    $("#att-list").innerHTML = `

      <div class="empty">

        Vá em

    enrolled.map(p => `

          <div class="small muted">

                ? "checked"
                : ""
            }
          >

        </label>


        <span class="small muted">

          ${
            existing.has(p.id)

              ?

                existing.get(p.id)
                  ? "Presente registrada"
                  : "Falta registrada"
              )

              :

              "Não registrado"
          }

        </span>

      </div>

    `).join("");

/* =========================
   SALVAR CHECK-IN
========================= */

function saveAttendance(){

  const courseId =
    $("#att-course").value;


  const date =
    $("#att-date").value;


  if(!courseId || !date){

    showToast(
      "Selecione o curso e a data."
    );

    return;

  }


  /*
    Primeiro remove os registros
    daquele curso e daquela data.
  */

  db.attendance =
    db.attendance.filter(
      item =>
        !(
          item.courseId === courseId &&
          item.date === date
        )
    );


  /*
    Depois cria novamente
    a chamada atual.
  */

  document
    .querySelectorAll(
      "#att-list input[data-pid]"
    )
    .forEach(input => {

      db.attendance.push({

        date:date,

        courseId:courseId,

        participantId:
          input.dataset.pid,

        present:
          input.checked

      });

    });


  save();


  showToast(
    "✓ Chamada salva com sucesso!"
  );


  loadAttendanceList();

}

function exportData(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          db,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const link =
    document.createElement("a");


  link.href =
    URL.createObjectURL(blob);


  link.download =
    `backup-cip-${today()}.json`;


  link.click();


  URL.revokeObjectURL(
    link.href
  );


  showToast(
    "Backup exportado."
  );

}


function resetDemo(){

  if(
    !confirm(
      "Restaurar os dados de demonstração?"
    )
  ){

    return;

  }


  db =
    structuredClone(seed);


  save();

  render();

  showToast(
    "Dados restaurados."
  );

}

        go(

        );

        return;

      const quick =
        event.target.closest(

        );


      if(quick){

        go("participants");

        setTimeout(
          () => openParticipant(),
          0
        );

        return;

      }


      const close =
        event.target.closest(
          "#modal-close"
        );


      if(close){

        closeModal();

        return;

      }


      if(
        event.target.id === "modal"
      ){

        closeModal();

      }

    }
  );


  render();

}


document.addEventListener(
  "DOMContentLoaded",
  initApp
);

</script>

</body>
</html>
